  // ---------------- QR CODES (?page=qrcodes) ----------------
  var QR_LIB = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';
  var qrLoading = false;
  var B = { data: null, busy: false, msg: '', layout: 'bib', cat: 'All' };

  function viewQr() {
    var signedIn = M.station && M.pin && (stType(M.station) === 'kit' || stType(M.station) === 'payment');
    var head = '<section class="phead no-print"><div class="phead-ic">🔳</div><div><h1>Race bibs &amp; QR codes</h1>' +
      '<p>Each QR code belongs to one runner only. It carries a security code made from that runner’s registration, so a copied-over or made-up QR code shows as not valid when scanned.</p>' +
      (signedIn && B.data ? '<div class="actions"><button type="button" class="btn" data-print="1">🖨 Print</button></div>' : '') + '</div></section>';
    if (!signedIn) {
      return head + '<section class="sec">' + empty('🔒', 'Printing bibs is for the Kit Claiming or Payment Desk team. Open the staff page, sign in with that station’s PIN, then tap “Print race bibs &amp; QR codes”.') +
        '<div style="text-align:center;margin-top:12px"><a href="#" class="btn" data-page="marshal">Open the staff page</a></div></section>';
    }
    if (!B.data && !B.busy && !B.msg) setTimeout(bibLoad, 0);
    if (B.msg) return head + '<section class="sec">' + empty('⚠️', esc(B.msg)) + '</section>';
    if (!B.data) return head + '<section class="sec">' + empty('⏳', 'Loading bibs…') + '</section>';
    var d = B.data;
    var list = d.bibs.filter(function (b) { return B.cat === 'All' || b.cat === B.cat; });
    var link = function (b) { return d.url + '?bib=' + b.bib + '&c=' + b.code; };
    var tools = '<div class="toolbar no-print"><div class="tabs">' +
      '<button type="button" class="tab' + (B.layout === 'bib' ? ' on' : '') + '" data-blayout="bib">Race bibs (2 per page)</button>' +
      '<button type="button" class="tab' + (B.layout === 'stub' ? ' on' : '') + '" data-blayout="stub">Small claim stubs</button></div>' +
      '<div class="tabs">' + ['All'].concat(d.categories).map(function (c) {
        return '<button type="button" class="tab' + (B.cat === c ? ' on' : '') + '" data-qrcat="' + esc(c) + '">' + esc(c) + '</button>';
      }).join('') + '</div><span class="muted">' + plural(list.length, 'bib') + '</span></div>';
    var body = B.layout === 'bib'
      ? '<div class="racebibs">' + list.map(function (b) {
          return '<div class="racebib"><i class="pin tl"></i><i class="pin tr"></i><i class="pin bl"></i><i class="pin br"></i>' +
            '<div class="rb-band bg-' + catKey(b.cat) + '"><span>' + esc(d.eventName) + '</span><b>' + esc(b.cat) + '</b></div>' +
            '<div class="rb-no">' + esc(b.bib) + '</div><div class="rb-name">' + esc(b.first || b.name) + '</div>' +
            '<div class="rb-foot"><div class="rb-meta"><svg class="bc" data-bc="' + esc(b.bib) + '"></svg>' +
            '<div>' + esc(b.name) + '</div><div>Singlet ' + esc(b.size || '—') + ' · Code ' + esc(b.code) + '</div>' +
            '<div class="rb-hint">Scan the QR code to verify this runner</div></div><div class="qr" data-qr="' + esc(link(b)) + '"></div></div></div>';
        }).join('') + '</div>'
      : '<div class="qr-grid">' + list.map(function (b) {
          return '<div class="qr-card"><div class="qr" data-qr="' + esc(link(b)) + '"></div><div class="qr-bib">' + esc(b.bib) + '</div>' +
            '<div class="qr-name">' + esc(b.name) + '</div><div class="qr-meta">' + esc(b.cat) + (b.size ? ' · Singlet ' + esc(b.size) : '') + '</div>' +
            '<svg class="bc bc-sm" data-bc="' + esc(b.bib) + '"></svg></div>';
        }).join('') + '</div>';
    return head + '<section class="sec">' + tools + body + '</section>';
  }

  function bibLoad() {
    if (!hasGas()) { B.msg = 'Open this page from the event website link.'; render(); return; }
    B.busy = true;
    google.script.run.withSuccessHandler(function (res) {
      B.busy = false;
      if (res && res.authError) { M.pin = ''; M.error = res.error; mSave(); state.page = 'marshal'; render(); return; }
      if (!res || !res.ok) B.msg = (res && res.error) || 'Could not load the bibs.';
      else B.data = res;
      render();
    }).withFailureHandler(function () { B.busy = false; B.msg = 'No signal. Reload the page to try again.'; render(); })
      .getBibSheet(staffReq({}));
  }

  function qrBadge(check, bib, forRunner) {
    if (check === 'valid') return '<div class="v-line ok">🔒 Genuine QR code for bib ' + esc(bib) + '</div>';
    if (check === 'invalid') {
      return '<div class="v-line bad">⚠️ This QR code is NOT valid for bib ' + esc(bib) + '. ' + (forRunner
        ? 'Please show your race bib to the organizers.'
        : 'It was not issued by the organizers, or the bibs were re-numbered. Check the runner’s ID.') + '</div>';
    }
    return '';
  }

  var BC_LIB = 'https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/barcodes/JsBarcode.code128.min.js', bcLoading = false;

  function drawBarcodes() {
    if (!document.querySelector('svg.bc[data-bc]')) return;
    if (!window.JsBarcode) {
      if (bcLoading) return;
      bcLoading = true;
      var s = document.createElement('script');
      s.src = BC_LIB; s.onload = drawBarcodes; s.onerror = function () { bcLoading = false; };
      document.head.appendChild(s);
      return;
    }
    document.querySelectorAll('svg.bc[data-bc]').forEach(function (el) {
      if (el.getAttribute('data-done')) return;
      try {
        // The barcode holds the race bib number only. Stub barcodes carry their own blank side margins (scanners need them).
        var sm = el.classList.contains('bc-sm');
        window.JsBarcode(el, el.getAttribute('data-bc'), { format: 'CODE128', displayValue: false,
          margin: sm ? 20 : 0, marginTop: 0, marginBottom: 0, width: sm ? 2 : 3, height: sm ? 34 : 46 });
        el.setAttribute('preserveAspectRatio', sm ? 'xMidYMid meet' : 'xMinYMid meet');   // real size, never stretched
        el.setAttribute('data-done', '1');
      } catch (err) {}
    });
  }

  function drawQrs() {
    if (state.page === 'qrcodes') drawBarcodes();
    if (state.page !== 'qrcodes' || !document.querySelector('.qr[data-qr]')) return;
    if (!window.qrcode) { loadQrLib(); return; }
    document.querySelectorAll('.qr[data-qr]').forEach(function (el) {
      if (el.firstChild) return;
      var q = window.qrcode(0, 'M');
      q.addData(el.getAttribute('data-qr'));
      q.make();
      var img = new Image();
      img.alt = 'QR code';
      img.src = q.createDataURL(4, 0);
      el.appendChild(img);
    });
  }

  function loadQrLib() {
    if (qrLoading) return;
    qrLoading = true;
    var s = document.createElement('script');
    s.src = QR_LIB;
    s.onload = drawQrs;
    s.onerror = function () {
      qrLoading = false;
      var g = $('.qr-grid');
      if (g) g.insertAdjacentHTML('beforebegin', '<div class="hint">Could not load the QR code generator. Check the internet connection and reload.</div>');
    };
    document.head.appendChild(s);
  }

  function payPublic(r) {
    if (r.pay === 'verified') return '✅ Payment verified';
    if (r.pay === 'issue') return '⚠️ Payment needs attention – please contact the organizers';
    return '⏳ Payment being checked';
  }


  // ---------------- QR SCANNING AT CHECKPOINTS ----------------
  // Three ways, all record automatically and send the bib's security code to be checked:
  //  1. In-page camera scanner (continuous; needs the camera to be allowed inside the website)
  //  2. Bluetooth / USB QR scanner that "types" the QR link into the bib box
  //  3. The phone's own camera app opening the QR link (?bib=…&c=…)
  function parseQrLink(raw) {
    var t = String(raw || '');
    var m = t.match(/[?&]bib=(\d+)(?:&c=([0-9a-f]{10}))?/i) ||   // QR code: the bib link
      t.match(/^\s*(\d{1,6})-([0-9a-f]{10})\s*$/i);             // barcode from an older printout: 5001-5992C4DBCE
    return m ? { bib: String(Number(m[1])), code: (m[2] || '').toUpperCase() } : null;
  }

  function recentlyRecorded(bib) {
    return M.recent.some(function (e) {
      return e.bib === bib && Date.now() - e.clientTime < 120000 && e.code !== 'ERROR' && e.code !== 'UNDONE' && e.code !== 'INVALID_QR';
    });
  }

  var CAM = { on: false, stream: null, video: null, timer: null, last: {}, detector: null, reason: '', audio: null, libLoading: false };
  var JSQR_LIB = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';

  function camIdleText() { return CAM.paused ? 'Paused – tap “Scan next runner”' : 'Point the camera at the QR code on the bib'; }
  function camHtml() {
    return (CAM.on && CAM.paused ? '<button type="button" class="btn cam-btn" data-cam="next">▶ Scan next runner</button>' : '') +
      '<button type="button" class="btn ' + (CAM.on && !CAM.paused ? '' : 'ghost ') + 'cam-btn" data-cam="' + (CAM.on ? 'stop' : 'start') + '">' +
      (CAM.on ? '⏹ Stop camera' : (/^(kit|payment)$/.test(stType(M.station)) ? '📷 Scan a bib QR code to find the runner' : '📷 Scan bib QR codes with this phone’s camera')) + '</button>' +
      (CAM.on ? '<div class="cam-box' + (CAM.paused ? ' paused' : '') + '"><video id="cam-video" playsinline muted autoplay></video><div class="cam-frame"></div>' +
        '<div id="cam-msg" class="cam-msg">' + camIdleText() + '</div></div>' : '') +
      (CAM.reason ? camHelpHtml(CAM.reason) : '');
  }

  function camRender() {
    var w = $('#cam-wrap');
    if (!w) return;
    w.innerHTML = camHtml();
    var v = $('#cam-video');
    if (CAM.on && CAM.stream && v) {
      v.srcObject = CAM.stream;
      var p = v.play(); if (p && p.catch) p.catch(function () {});
      CAM.video = v;
    }
  }

  // Why the camera can't start, so the marshal gets the right fix
  function camReasonFromEnv() {
    var ua = navigator.userAgent || '';
    if (/FBAN|FBAV|FB_IAB|FBIOS|Messenger|Instagram|Line\/|MicroMessenger|TikTok/i.test(ua)) return 'inapp';
    if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return 'unsupported';
    try {
      var pol = document.permissionsPolicy || document.featurePolicy;
      if (pol && pol.allowsFeature && !pol.allowsFeature('camera')) return 'frame';
    } catch (err) {}
    return '';
  }

  function camReasonFromError(err) {
    var env = camReasonFromEnv();
    if (env) return env;
    var n = (err && err.name) || '';
    if (/NotAllowed|Security|PermissionDenied/.test(n)) return /policy|not allowed in this document/i.test((err && err.message) || '') ? 'frame' : 'denied';
    if (/NotFound|Overconstrained|DevicesNotFound/.test(n)) return 'nocam';
    if (/NotReadable|TrackStart/.test(n)) return 'busy';
    return 'other';
  }

  function camHelpHtml(reason) {
    var ios = /iPhone|iPad|iPod/i.test(navigator.userAgent || '');
    var fix = {
      inapp: '<b>This page is open inside Facebook / Messenger.</b> Their built-in browser blocks the camera. Tap ⋮ or ··· at the top → <b>Open in Chrome</b> (or <b>Open in Safari</b>), then sign in to your station again.',
      denied: '<b>The camera permission is off.</b> ' + (ios
        ? 'iPhone: Settings → Safari (or Chrome) → Camera → Allow, then reload this page.'
        : 'Android: tap the icon left of the web address → Permissions → Camera → Allow, then reload. Also check Settings → Apps → Chrome → Permissions → Camera.') +
        ' If it is already allowed, this browser blocks the camera inside Google’s frame – use one of the options below.',
      frame: '<b>Google does not allow the camera inside this website on this browser.</b> The website runs inside a Google frame, and Chrome blocks the camera there. No setting on the phone can change this – use one of the options below.',
      nocam: '<b>No camera was found</b> on this device.',
      busy: '<b>Another app is using the camera.</b> Close it (camera, video call) and tap the camera button again.',
      unsupported: '<b>This browser can’t use the camera here.</b> Open the page in Chrome (Android) or Safari (iPhone).',
      other: '<b>The camera could not start.</b> Reload the page and try again.'
    }[reason] || '';
    var desk = /^(kit|payment)$/.test(stType(M.station));
    return '<div class="cam-help"><div>' + fix + '</div><div class="cam-alt"><b>Other ways to scan:</b><ol>' +
      (DATA.scannerLink ? '<li><a class="btn" href="' + safeUrl(DATA.scannerLink) + '" target="_blank" rel="noopener">📷 Open the camera scanner page</a><br>' +
        'The camera works there because it is outside Google’s frame. Sign in with the same station and PIN.</li>'
        : '<li><b>Camera scanner page – not set up yet.</b> Organizer: put the free camera scanner page on GitHub Pages once (see the setup guide) and paste its address in <b>Site - Info → Camera Scanner Page</b>. A button to open it then appears here.</li>') +
      '<li><b>Phone camera app:</b> point the phone’s normal camera at the bib QR and tap the link that appears. Keep this station signed in on this phone.</li>' +
      '<li><b>USB or Bluetooth scanner:</b> just scan the QR code or barcode on the bib – no need to tap anything.</li>' +
      (desk ? '<li><b>Type the bib number or name</b> and tap Find runner.</li>' : '<li><b>Type the bib number</b> and tap Confirm.</li>') + '</ol></div></div>';
  }

  function camStart() {
    CAM.reason = '';
    var pre = camReasonFromEnv();
    if (pre === 'frame' || pre === 'unsupported') { CAM.reason = pre; camRender(); return; }
    try { CAM.audio = CAM.audio || new (window.AudioContext || window.webkitAudioContext)(); } catch (err) {}
    if (!window.jsQR) loadJsQr();
    if (CAM.detector === null) {
      CAM.detector = false;
      try {
        if (window.BarcodeDetector && window.BarcodeDetector.getSupportedFormats) {
          window.BarcodeDetector.getSupportedFormats().then(function (f) {
            if (f.indexOf('qr_code') !== -1) CAM.detector = new window.BarcodeDetector({ formats: ['qr_code'] });
          }).catch(function () {});
        }
      } catch (err) {}
    }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }).then(function (stream) {
      CAM.stream = stream; CAM.on = true; CAM.last = {};
      camRender();
      keepAwake();
      camLoop();
    }).catch(function (err) { CAM.on = false; CAM.reason = camReasonFromError(err); camRender(); });
  }

  function camResume() {                         // desks: scan the next runner
    if (!CAM.paused) return;
    CAM.paused = false;
    var now = Date.now();
    Object.keys(CAM.last).forEach(function (b) { CAM.last[b] = now; });   // the bib just handled is still in view: ignore it for 20 s
    camRender();
  }

  function camStop() {
    CAM.on = false; CAM.paused = false;
    clearTimeout(CAM.timer);
    if (CAM.stream) CAM.stream.getTracks().forEach(function (t) { t.stop(); });
    CAM.stream = null; CAM.video = null;
    camRender();
  }

  function loadJsQr() {
    if (CAM.libLoading || window.jsQR) return;
    CAM.libLoading = true;
    var s = document.createElement('script');
    s.src = JSQR_LIB;
    s.onerror = function () { CAM.libLoading = false; camMessage('Could not load the QR reader. Check the internet connection.', 'bad'); };
    document.head.appendChild(s);
  }

  function camLoop() {
    if (!CAM.on) return;
    var v = CAM.video;
    if (v && !CAM.paused && v.readyState >= 2 && v.videoWidth) {
      decodeFrame(v).then(function (text) { if (text && !CAM.paused) camFound(text); }).catch(function () {});
    }
    CAM.timer = setTimeout(camLoop, 250);
  }

  function decodeFrame(v) {
    if (CAM.detector) {
      return CAM.detector.detect(v).then(function (codes) { return codes && codes.length ? codes[0].rawValue : ''; })
        .catch(function () { CAM.detector = false; return ''; });
    }
    if (!window.jsQR) return Promise.resolve('');
    var scale = Math.min(1, 720 / v.videoWidth);
    var w = Math.round(v.videoWidth * scale), h = Math.round(v.videoHeight * scale);
    var c = CAM.canvas || (CAM.canvas = document.createElement('canvas'));
    c.width = w; c.height = h;
    var ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(v, 0, 0, w, h);
    var r = window.jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' });
    return Promise.resolve(r ? r.data : '');
  }

  function camMessage(text, kind, ms) {
    var el = $('#cam-msg');
    if (!el) return;
    el.textContent = text;
    el.className = 'cam-msg' + (kind ? ' ' + kind : '');
    clearTimeout(CAM.msgTimer);
    CAM.msgTimer = setTimeout(function () {
      var e2 = $('#cam-msg');
      if (e2) { e2.textContent = camIdleText(); e2.className = 'cam-msg'; }
    }, ms || 2500);
  }

  /** The server's answer, shown on top of the camera view so the marshal never has to scroll. */
  function camResult(e) {
    if (!CAM.on || !e) return;
    var who = e.bib + (e.name ? ' ' + e.name : '');
    var warn = e.warnings && e.warnings.length;
    var t = {
      OK: '✅ ' + who + ' – checked in',
      FINISHED: '🏁 ' + who + ' – finished' + (e.rank ? ' #' + e.rank : '') + (e.bracket ? ' · ' + e.bracket : ''),
      STARTED: '🟢 ' + who + ' – started' + (warn ? ' (' + e.warnings.join(', ') + ')' : ''),
      FINISHED_NO_TURN: '⚠️ ' + who + ' – no turning point record',
      DUPLICATE: '⚠️ ' + e.bib + ' already checked in here',
      DUPLICATE_FINISH: '⚠️ ' + e.bib + ' already finished',
      DUPLICATE_START: '⚠️ ' + e.bib + ' already started',
      WRONG_CATEGORY: '⚠️ ' + who + ' – wrong turning point (' + (e.cat || '?') + ')',
      NOT_REGISTERED: '❌ ' + e.bib + ' is not registered',
      INVALID_QR: '❌ Fake or old bib code on ' + e.bib + ' – not counted'
    }[e.code] || ('❌ ' + e.bib + ' not saved');
    var good = /^(OK|FINISHED|STARTED)$/.test(e.code) && !warn;
    camMessage(t, good ? 'good' : 'bad', good ? 2500 : 5000);
    if (!good) beep(false);
  }

  function beep(ok) {
    try {
      var a = CAM.audio; if (!a) return;
      var o = a.createOscillator(), g = a.createGain();
      o.frequency.value = ok ? 1320 : 330; g.gain.value = 0.15;
      o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + (ok ? 0.12 : 0.35));
    } catch (err) {}
  }

  function camFound(text) {
    var link = parseQrLink(text), now = Date.now();
    if (!link) {
      if (!CAM.lastBad || now - CAM.lastBad > 3000) { CAM.lastBad = now; camMessage('That QR code is not a race bib', 'bad'); beep(false); }
      return;
    }
    if (CAM.last[link.bib] && now - CAM.last[link.bib] < 20000) return;   // same bib still in front of the camera
    CAM.last[link.bib] = now;
    var type = stType(M.station), desk = /^(kit|payment)$/.test(type);
    if (type === 'kit') kitSearch(text);                 // opens the runner, with the QR security check
    else if (type === 'payment') payFind(link.bib);
    else mRecord(link.bib, link.code);
    if (desk) { CAM.paused = true; camRender(); }        // desks: one runner at a time – no surprise switch mid-release
    camMessage('✅ Bib ' + link.bib + (desk ? ' found' : ' scanned'), 'good', desk ? 4000 : 2500);
    beep(true);
    try { if (navigator.vibrate) navigator.vibrate(120); } catch (err) {}
  }

  // ---------------- WIRED / BLUETOOTH SCANNER (works like a keyboard) ----------------
  // A scanner "types" very fast and ends with Enter. When no text box is selected, those fast
  // keystrokes are caught here, so scans still count while the camera is on or after tapping a button.
  var KB = { buf: '', last: 0, timer: null, slow: false }, BOX = { last: 0, slow: true, timer: null };
  function scanSpeed(text, slow) {              // finished without Enter: a QR link, or a bare bib number typed at scanner speed
    return !!parseQrLink(text) || (!slow && /^\d{3,6}$/.test(text));
  }
  document.addEventListener('keydown', function (e) {
    if (state.page !== 'marshal' || !M.station || !M.pin) return;
    var el = document.activeElement;
    if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable)) return;   // the box gets it
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var now = Date.now(), gap = now - KB.last;
    if (gap > 150) { KB.buf = ''; KB.slow = false; }  // people type slower than this: start a new scan
    else if (gap > 60) KB.slow = true;                // quick, but slower than a scanner
    KB.last = now;
    if (e.key === 'Enter') {
      if (KB.buf.length >= 3) { e.preventDefault(); scannerInput(KB.buf); }
      KB.buf = ''; clearTimeout(KB.timer); return;
    }
    if (e.key && e.key.length === 1) {
      KB.buf += e.key;
      clearTimeout(KB.timer);
      KB.timer = setTimeout(function () {             // scanners set to "no Enter": finish after a short pause
        if (scanSpeed(KB.buf, KB.slow)) scannerInput(KB.buf);
        KB.buf = '';
      }, 250);
    }
  });

  function scannerInput(text) {
    M.scannerSeen = true;
    var hint = $('#m-scanhint'); if (hint) hint.innerHTML = scanHint();
    var type = stType(M.station);
    if (type === 'kit') { kitSearch(text); return; }
    if (type === 'payment') { payFind(bibFromText(text) || text); return; }
    var link = parseQrLink(text);
    if (link) mRecord(link.bib, link.code);
    else mRecord(String(text).replace(/\D/g, ''), '');
    if (CAM.on) camMessage('🔫 Bib ' + (link ? link.bib : String(text).replace(/\D/g, '')) + ' scanned', 'good');
  }

  function payFind(q) {                         // Payment Desk: show this runner whatever their payment status
    P.q = String(q || ''); P.tab = 'All';
    var pq = $('#p-q'); if (pq) pq.value = P.q;
    payRefresh();
  }

  function scanHint() {
    return M.scannerSeen ? '🔫 <b>Scanner working</b> – every scan is recorded automatically.'
      : '🔫 Using a wired or Bluetooth scanner? Just scan – no need to tap anything. It also works while the camera is on.';
  }

  // ---------------- router ----------------
  var VIEWS = {
    home: viewHome, funrun: viewFunRun,
    basketball: function () { return viewSport('basketball'); },
    volleyball: function () { return viewSport('volleyball'); },
    pickleball: function () { return viewSport('pickleball'); },
    mlbb: function () { return viewSport('mlbb'); },
    bingo: viewBingo, trees: viewTrees, mentors: viewMentors, marshal: viewMarshal, qrcodes: viewQr, live: viewLive, kits: viewKits,
    parade: function () { return viewProgramPage('parade'); }, ball: function () { return viewProgramPage('ball'); }
  };

  function render() {
    if (state.page !== 'marshal' && CAM.on) camStop();
    document.body.classList.toggle('marshal-mode', state.page === 'marshal');
    document.body.classList.toggle('board-mode', state.page === 'live' || state.page === 'kits');
    renderNav();
    $('#app').innerHTML = (VIEWS[state.page] || viewHome)();
    renderFooter();
    tick();
    if (state.page === 'marshal') {
      var f = $('#m-bib') || $('#k-q');
      if (f) f.focus();
      keepAwake();
      if (CAM.on) { if ($('#cam-wrap')) camRender(); else camStop(); }
      if (M.scanBib && M.station && M.pin) {        // opened from a bib QR code on a staff phone
        var sb = M.scanBib, ty = stType(M.station), chk = M.scanCheck || '', sc = M.scanCode || '';
        M.scanBib = ''; M.scanCheck = ''; M.scanCode = '';
        if (ty === 'kit') { K.pendingCheck = chk; kitSearch(sb); }
        else if (ty === 'payment') { P.q = sb; var pq = $('#p-q'); if (pq) pq.value = sb; payRefresh(); }
        else if ($('#m-bib')) {
          if (chk === 'valid' && !recentlyRecorded(sb)) mRecord(sb, sc);            // scanned with the phone camera app: record now
          else if (chk === 'valid') { M.note = 'Bib ' + sb + ' was already recorded on this phone a moment ago.'; mRefresh(); }
          else if (chk === 'invalid') { M.note = '⚠️ That QR code is NOT valid for bib ' + sb + '. Nothing was recorded – check the bib and the runner.'; mRefresh(); }
          else $('#m-bib').value = sb;                                                // older QR without a security code: tap Confirm
        }
      }
    }
    if (state.page === 'qrcodes') drawQrs();
    if (state.page === 'live') keepAwake();
    if (state.page === 'kits') { keepAwake(); kbFit(); kbTurn(); }
    if (state.page === 'live' || state.page === 'funrun') refreshRace();   // check for new check-ins right away
    if (state.page === 'funrun' && state.scrollToBib && $('#bibq')) { state.scrollToBib = false; $('#bibq').scrollIntoView({ block: 'center' }); }
  }

  function go(page) {
    if (!isPage(page)) page = 'home';
    if (DATA.light && page !== 'marshal' && page !== 'qrcodes' && hasGas()) {
      $('#app').innerHTML = '<section class="sec">' + empty('⏳', 'Loading the event website…') + '</section>';
      google.script.run.withSuccessHandler(function (txt) {
        try { DATA = JSON.parse(txt); } catch (err) { return; }
        go(page);
      }).withFailureHandler(function (err) {
        var why = navigator.onLine === false ? 'there is no internet connection on this device' : friendlyError(String((err && err.message) || err || ''));
        $('#app').innerHTML = '<section class="sec">' + empty('📶', 'Could not load the website: ' + esc(why) + '. Then try again.') + '</section>';
      })
        .getSiteData();
      return;
    }
    state.page = page;
    render();
    window.scrollTo(0, 0);
    try { google.script.history.push({ page: page }, { page: page }); } catch (e) {}
  }

  function tick() {
    var up = $('#updated');
    if (up) up.textContent = 'Updated ' + rel(DATA.checkedMs || DATA.generatedMs);
    var ku = $('#kb-upd');
    if (ku) ku.textContent = 'Updated ' + rel(DATA.checkedMs || DATA.generatedMs);
    var ru = $('#race-upd');
    if (ru && (raceActive() || state.page === 'live')) ru.textContent = raceUpdated();
    document.querySelectorAll('.bd-clock[data-gun]').forEach(function (el) {
      el.textContent = '⏱ ' + raceClock(Date.now() - Number(el.getAttribute('data-gun')));
    });
    var mc = $('#m-clock');
    if (mc) mc.textContent = mClock(Date.now());
    if (state.page === 'marshal' && M.queue.length && !M.sending && (M.offline || M.lastError)) mRefreshPending();
    var cd = $('#countdown');
    if (!cd || !DATA.info.countdownMs) return;
    var ms = DATA.info.countdownMs - Date.now();
    if (ms <= 0) { cd.innerHTML = '<div class="cd-done">🎉 It’s happening now — see you there!</div>'; return; }
    var s = Math.floor(ms / 1000), parts = [[Math.floor(s / 86400), 'days'], [Math.floor(s % 86400 / 3600), 'hrs'], [Math.floor(s % 3600 / 60), 'min'], [s % 60, 'sec']];
    cd.innerHTML = parts.map(function (p) { return '<div class="cd"><b>' + (p[1] === 'days' ? p[0] : ('0' + p[0]).slice(-2)) + '</b><small>' + p[1] + '</small></div>'; }).join('');
  }

  // ---------------- events ----------------
  document.addEventListener('click', function (e) {
    var t = e.target.closest('#updated, #race-upd, #kb-upd');
    if (t) { t.textContent = 'Checking…'; refreshData.busy = 0; refreshData(); refreshRace(true); return; }   // one tap: update now
    t = e.target.closest('[data-page]');
    if (t) { e.preventDefault(); go(t.getAttribute('data-page')); return; }
    t = e.target.closest('[data-runcat]');
    if (t) { state.runnerCat = t.getAttribute('data-runcat'); state.runnerLimit = 60; $('#runtabs').innerHTML = runTabs(); $('#runlist').innerHTML = runnerList(); return; }
    t = e.target.closest('[data-rescat]');
    if (t) { state.resultCat = t.getAttribute('data-rescat'); $('#results-sec').innerHTML = resultsSection(); return; }
    t = e.target.closest('[data-more]');
    if (t) { state.runnerLimit += 60; $('#runlist').innerHTML = runnerList(); return; }
    t = e.target.closest('[data-lane]');
    if (t) { var lk = t.getAttribute('data-lane'); TRK.open[lk] = !TRK.open[lk]; $('#trk-body').innerHTML = trackBody(); return; }
    t = e.target.closest('[data-kbcat]');
    if (t) { KBD.cat = t.getAttribute('data-kbcat'); KBD.page = 0; $('#kb-tabs').innerHTML = kbTabs(); $('#kb-sum').innerHTML = kbSummary(); kbRedraw(); kbFit(); return; }
    t = e.target.closest('[data-trkcat]');
    if (t) { state.trackCat = t.getAttribute('data-trkcat'); $('#trk-tabs').innerHTML = trackTabs(); $('#trk-body').innerHTML = trackBody(); return; }
    t = e.target.closest('[data-pick]');
    if (t) {
      M.pick = t.getAttribute('data-pick'); M.error = '';
      document.querySelectorAll('.m-pick').forEach(function (b) { b.classList.toggle('on', b === t); });
      var pin = $('#m-pin'); if (pin) pin.focus();
      return;
    }
    t = e.target.closest('[data-undo]');
    if (t) { mUndo(t.getAttribute('data-undo')); return; }
    t = e.target.closest('[data-kpick]');
    if (t) {
      var kid = t.getAttribute('data-kpick');
      K.card = (K.res || []).filter(function (r) { return r.regId === kid; })[0] || null;
      K.ok = ''; K.confirmUnpaid = false; kitRefresh(); return;
    }
    t = e.target.closest('[data-krelease]');
    if (t) { kitRelease(t.getAttribute('data-krelease')); return; }
    t = e.target.closest('[data-kundo]');
    if (t) { kitUndo(t.getAttribute('data-kundo')); return; }
    t = e.target.closest('[data-ptab]');
    if (t) { P.tab = t.getAttribute('data-ptab'); payRefresh(); return; }
    t = e.target.closest('[data-pay]');
    if (t) { paySet(t); return; }
    t = e.target.closest('[data-prefresh]');
    if (t) { payLoad(); return; }
    t = e.target.closest('[data-qrcat]');
    if (t) { B.cat = t.getAttribute('data-qrcat'); render(); return; }
    t = e.target.closest('[data-blayout]');
    if (t) { B.layout = t.getAttribute('data-blayout'); render(); return; }
    t = e.target.closest('[data-mclear]');
    if (t) { mClear(t.getAttribute('data-mclear')); return; }
    t = e.target.closest('[data-sendnow]');
    if (t) { M.fails = 0; clearTimeout(M.retryTimer); mPump(); return; }
    t = e.target.closest('[data-cam]');
    if (t) { var ca = t.getAttribute('data-cam'); if (ca === 'start') camStart(); else if (ca === 'next') camResume(); else camStop(); return; }
    t = e.target.closest('[data-print]');
    if (t) { window.print(); return; }
    t = e.target.closest('[data-m="logout"]');
    if (t) {
      if (M.queue.length) { M.note = M.queue.length + ' check-in(s) still waiting to send. Stay on this station until they are sent.'; mRefresh(); return; }
      camStop(); M.pin = ''; M.pick = ''; M.station = null; M.error = ''; kitReset(); payReset(); B.data = null; B.msg = ''; mSave(); render();
    }
  });
  window.addEventListener('resize', function () {   // TV / window resized or phone turned: re-fit the kit board
    if (state.page !== 'kits') return;
    clearTimeout(KBD.rs);
    KBD.rs = setTimeout(function () { if (kbWide() !== KBD.wide) render(); else kbFit(); }, 250);
  });
  document.addEventListener('submit', function (e) {
    if (e.target.id === 'm-form') { e.preventDefault(); mSubmit(); }
    if (e.target.id === 'm-login') { e.preventDefault(); mLogin(); }
    if (e.target.id === 'k-form') { e.preventDefault(); kitSearch(($('#k-q') || {}).value); }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'bibq') { state.bibQuery = e.target.value; $('#bibres').innerHTML = bibResults(); }
    if (e.target.id === 'runq') { state.runnerQuery = e.target.value; state.runnerLimit = 60; $('#runlist').innerHTML = runnerList(); }
    if (e.target.id === 'kbq') { KBD.q = e.target.value; $('#kb-body').innerHTML = kbBody(); }
    if (e.target.id === 'trackq') { state.trackQuery = e.target.value; $('#trk-body').innerHTML = trackBody(); }
    if (e.target.id === 'm-bib') {                 // Bluetooth/USB scanner typed into the box: record it without Enter
      var lk = parseQrLink(e.target.value), now = Date.now(), v = e.target.value.trim();
      if (lk && lk.code) { mSubmit(); return; }
      BOX.slow = v.length <= 1 ? false : (BOX.slow || now - BOX.last > 60);   // a person's taps are never this fast
      BOX.last = now;
      clearTimeout(BOX.timer);
      if (!BOX.slow && /^\d{3,6}$/.test(v)) BOX.timer = setTimeout(function () {
        var b = $('#m-bib');
        if (b && b.value.trim() === v) mSubmit();
      }, 300);
    }
    if (e.target.id === 'p-q') { P.q = e.target.value; $('#p-list').innerHTML = payList(); }
  });

  // ---------------- full refresh (on changes, plus every 5 minutes as a safety net) ----------------
  function refreshData() {
    if (!(window.google && google.script && google.script.run)) return;
    if (document.visibilityState === 'hidden') return;
    if (state.page === 'marshal' || state.page === 'qrcodes') return;   // staff screens don't need the website data
    if (refreshData.busy && Date.now() - refreshData.busy < 20000) return;   // already loading
    refreshData.busy = Date.now();
    lastFetch = Date.now();
    google.script.run.withSuccessHandler(function (txt) {
      refreshData.busy = 0;
      try { DATA = JSON.parse(txt); } catch (err) { return; }
      RP.ver = DATA.raceVer || ''; RP.site = DATA.siteVer || '';   // the live updates continue from this copy
      DATA.checkedMs = Date.now();
      if (KBD.prev) kbNoteChanges();
      if (state.page === 'marshal' || state.page === 'qrcodes') return;   // never redraw staff screens or the print sheet
      var a = document.activeElement, id = a && a.id, pos = a && a.selectionStart;
      var y = window.scrollY;
      render();
      window.scrollTo(0, y);
      if (id) {
        var el = document.getElementById(id);
        if (el) { el.focus({ preventScroll: true }); try { el.setSelectionRange(pos, pos); } catch (err) {} }
      }
    }).withFailureHandler(function () { refreshData.busy = 0; }).getSiteData();
  }
  setInterval(refreshData, 300000);
  refreshRace();                            // live race updates: every 3 s on race day (only downloads when something changed)
  setInterval(tick, 1000);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    if (Date.now() - lastFetch > 300000) refreshData();
    refreshRace(); keepAwake(); mPump();
  });
  window.addEventListener('online', function () { M.fails = 0; clearTimeout(M.retryTimer); mPump(); });   // back online → send at once
  try {
    google.script.history.setChangeHandler(function (ev) {
      var p = (ev.state && ev.state.page) || (ev.location && ev.location.parameter && ev.location.parameter.page) || 'home';
      state.page = isPage(p) ? p : 'home';
      render();
    });
  } catch (e) {}

  mLoad();
  if (INITIAL_PAGE === 'scan') {               // opened from a bib QR code
    if (M.station && M.pin) { state.page = 'marshal'; M.scanBib = INITIAL_BIB; M.scanCheck = INITIAL_CHECK; M.scanCode = INITIAL_CODE; }
    else { state.page = 'funrun'; state.bibQuery = INITIAL_BIB; state.scrollToBib = true; state.scanBib = INITIAL_BIB; state.scanCheck = INITIAL_CHECK; }
  }
  render();
  mPump();
};
</script>
<script>
// ---------------- LOADER: connects this page to the spreadsheet (through Apps Script doPost) ----------------
(function () {
  'use strict';
  var KEY = 'paskoriyuhan-site-v1';                       // last copy, so the page opens instantly next time
  var q = new URLSearchParams(location.search);
  var bib = String(q.get('bib') || '').replace(/\D/g, '').replace(/^0+(?=\d)/, '').slice(0, 6);
  window.INITIAL_BIB = bib;                                // opened from a bib QR code
  window.INITIAL_CODE = String(q.get('c') || '').replace(/[^0-9a-f]/gi, '').slice(0, 10).toUpperCase();
  window.INITIAL_CHECK = '';
  window.INITIAL_PAGE = bib ? 'scan' : String(q.get('page') || 'home').replace(/[^a-z]/g, '');
  window.INITIAL_DATA = null;
  var connected = /^https:\/\/script\.google\.com\/.+\/exec$/.test(String(API_URL || '').trim());

  // google.script.run, as on the Apps Script website, sent to the web app's doPost
  function call(fn, args, ok, fail) {
    if (!connected) { fail(new Error('This website is not connected to the spreadsheet yet.')); return; }
    fetch(String(API_URL).trim(), { method: 'POST', body: JSON.stringify({ action: 'rpc', fn: fn, args: args }) })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function (t) {
        var res;
        try { res = JSON.parse(t); } catch (e) {
          if (/function not found|doPost/i.test(t)) throw new Error('Unknown request (the script has no doPost)');
          throw new Error('access denied – the Apps Script link answered with a Google page instead of data');
        }
        if (!res || !res.ok) throw new Error((res && res.error) || 'The website did not answer properly');
        if (fn === 'getSiteData') { try { localStorage.setItem(KEY, res.value); } catch (e) {} }
        ok(res.value);
      })
      .catch(function (err) { fail(err); });
  }
  function runner() {
    var ok = function () {}, fail = function () {};
    var p = new Proxy({}, { get: function (t, k) {
      if (k === 'withSuccessHandler') return function (f) { ok = f || ok; return p; };
      if (k === 'withFailureHandler') return function (f) { fail = f || fail; return p; };
      if (k === 'withUserObject') return function () { return p; };
      return function () { call(String(k), Array.prototype.slice.call(arguments), ok, fail); };
    } });
    return p;
  }
  window.google = { script: {
    get run() { return runner(); },
    history: {
      push: function (st, params) {
        var u = new URLSearchParams();
        Object.keys(params || {}).forEach(function (k) { if (params[k] && !(k === 'page' && params[k] === 'home')) u.set(k, params[k]); });
        try { history.pushState(st || null, '', location.pathname + (String(u) ? '?' + u : '')); } catch (e) {}
      },
      setChangeHandler: function (fn) {
        window.addEventListener('popstate', function (e) {
          var p = {}; new URLSearchParams(location.search).forEach(function (v, k) { p[k] = v; });
          fn({ state: e.state, location: { parameter: p } });
        });
      }
    }
  } };

  function show(html) {
    var a = document.getElementById('app');
    if (a) a.innerHTML = '<section class="sec"><div class="card empty">' + html + '</div></section>';
  }
  if (!connected) {
    show('<span class="big">🔌</span>This website is not connected to the spreadsheet yet.<br>Open <b>index.html</b> and paste your Apps Script web app link (it ends in <b>/exec</b>) into <b>API_URL</b> near the top.');
    return;
  }
  var started = false, data = null, waiting = 0;
  function start() {
    if (started || !data) return;
    started = true;
    window.INITIAL_DATA = data;
    try { if (data.info && data.info.eventName) document.title = data.info.eventName; } catch (e) {}
    try {                                                  // the logo as the browser-tab icon
      if (data.info && data.info.logo) {
        var ic = document.querySelector('link[rel="icon"]') || document.head.appendChild(document.createElement('link'));
        ic.rel = 'icon'; ic.href = data.info.logo;
      }
    } catch (e) {}
    window.__startApp();
  }
  function done() { if (--waiting <= 0) start(); }
  // What went wrong, in plain words, and how to fix it
  function reason(err) {
    var m = String((err && err.message) || err || '');
    if (navigator.onLine === false) return ['There is no internet connection on this device.', 'Connect to Wi-Fi or mobile data, then tap Try again.'];
    if (/unknown request/i.test(m)) return ['The spreadsheet link is still running an older version of the script.',
      'In Apps Script: paste the latest Website.gs, then Deploy → Manage deployments → ✏️ Edit → Version: New version → Deploy (do not use New deployment – that makes a different link). Then reload this page.'];
    if (/access denied|HTTP 40[13]/i.test(m)) return ['The spreadsheet link is not open to everyone.',
      'Apps Script → Deploy → Manage deployments → ✏️ Edit → Execute as: Me, Who has access: Anyone → Deploy.'];
    if (/HTTP 404/i.test(m)) return ['The spreadsheet link in this page does not exist.',
      'Copy the Web app link (ends in /exec) from Apps Script → Deploy → Manage deployments into API_URL near the top of index.html.'];
    if (/HTTP 5\d\d|server error|lock|timed? ?out|exceeded/i.test(m)) return ['Google’s server could not answer right now.', 'Wait a minute, then tap Try again.'];
    if (/failed to fetch|load failed|networkerror|network request failed/i.test(m)) return ['The spreadsheet link could not be reached.',
      'Open the link in API_URL (near the top of index.html) in a browser. If it shows the event website, wait a minute and try again. If Google shows a message instead, deploy a new version of the script (Deploy → Manage deployments → ✏️ Edit → New version).'];
    return ['The spreadsheet answered with an error.', ''];
  }
  function failed(err) {
    var r = reason(err);
    show('<span class="big">📶</span><b>Could not load the event website.</b><br>' + r[0] + (r[1] ? '<br><br>' + r[1] : '') +
      '<br><br><button class="btn" type="button" onclick="location.reload()">Try again</button>' +
      '<br><small style="opacity:.6">Details: ' + String((err && err.message) || err || 'no answer').replace(/[<>&]/g, '') + '</small>');
  }
  var staff = window.INITIAL_PAGE === 'marshal';
  var cached = null;
  if (!staff) { try { cached = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {} }
  if (bib) {                                               // check the bib's QR security code first
    waiting++;
    call('checkBibQr', [bib, window.INITIAL_CODE], function (v) { window.INITIAL_CHECK = v || ''; done(); }, function () { done(); });
  }
  if (cached && cached.info) {
    data = cached;                                         // open at once; live updates bring it up to date in seconds
    if (!waiting) start();
  } else {
    waiting++;
    call(staff ? 'getMarshalPageData' : 'getSiteData', [], function (txt) {
      try { data = JSON.parse(txt); } catch (e) { data = null; }
      if (data) done(); else failed();
    }, failed);
  }
})();
</script>
