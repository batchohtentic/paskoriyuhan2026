  // ---------------- LIVE RACE TRACKER (Fun Run page) ----------------
  function hasGas() { return !!(window.google && google.script && google.script.run); }
  function relSec(ms) {
    var s = Math.max(0, Math.round((Date.now() - ms) / 1000));
    if (s < 60) return s + 's ago';
    return rel(ms);
  }
  function raceUpdated() { return DATA.race ? 'updated ' + relSec(DATA.race.checkedMs || DATA.race.updatedMs) : ''; }
  function raceActive() { var r = DATA.race; return !!(r && r.stations && r.stations.length && (r.live || r.window)); }
  function cpsFor(cat) {
    return (DATA.race.stations || []).filter(function (s) { return stType(s) === 'checkpoint' && (!s.cats.length || s.cats.indexOf(cat) !== -1); });
  }
  function bibMap() { var m = {}; DATA.funrun.runners.forEach(function (r) { m[r.bib] = r; }); return m; }

  function trackRows(cat) {
    var cps = cpsFor(cat), passBy = {}, finBy = {}, started = {};
    DATA.race.passes.forEach(function (p) { (passBy[p.bib] = passBy[p.bib] || {})[p.station] = p; });
    DATA.funrun.results.forEach(function (x) { if (x.cat === cat) finBy[x.bib] = x; });
    (DATA.race.starts || []).forEach(function (b) { started[b] = 1; });
    var mine = DATA.funrun.runners.filter(function (x) { return x.cat === cat; });
    var useStart = mine.some(function (x) { return started[x.bib]; });
    var rows = mine.map(function (x) {
      var ps = passBy[x.bib] || {}, fin = finBy[x.bib], last = null;
      cps.forEach(function (c) { if (ps[c.name]) last = c; });
      var stage = fin ? 3 : (last ? 2 : (useStart && !started[x.bib] ? 0 : 1));
      return { r: x, ps: ps, fin: fin, last: last, stage: stage, started: !!started[x.bib] };
    });
    rows.sort(function (a, b) {
      if (a.stage !== b.stage) return b.stage - a.stage;
      if (a.stage === 3) return (a.fin.rank || 1e9) - (b.fin.rank || 1e9);
      if (a.stage === 2) return a.ps[a.last.name].t - b.ps[b.last.name].t;
      return Number(a.r.bib) - Number(b.r.bib);
    });
    return { rows: rows, cps: cps, useStart: useStart };
  }

  function feedHtml() {
    var m = bibMap();
    var items = (DATA.race.feed || []).slice(0, state.page === 'live' ? 3 : (window.innerWidth < 640 ? 2 : 4));
    if (!items.length) return '';
    return '<div class="trk-feed">' + items.map(function (f) {
      var who = m[f.bib] ? esc(m[f.bib].name) : 'Runner';
      var what = f.kind === 'finish'
        ? '🏁 <b>Bib ' + esc(f.bib) + '</b> ' + who + ' finished ' + esc(f.cat) + (f.time ? ' in <b>' + esc(f.time) + '</b>' : '') + (f.rank ? ' · #' + esc(f.rank) : '')
        : '↩️ <b>Bib ' + esc(f.bib) + '</b> ' + who + ' passed ' + esc(f.station);
      return '<div class="feed-row"><time>' + esc(f.clock) + '</time><span>' + what + '</span></div>';
    }).join('') + '</div>';
  }

  // ---------------- LIVE BOARDS: one per category ----------------
  // Each category gets its own board: Start → Turning point (half the race distance) → Finish,
  // with the runners in each stretch. Checks for new check-ins every 3 seconds on race day.
  var TRK = { open: {}, prev: null, moved: {} };

  function catKm(cat) { var m = String(cat || '').match(/\d+(?:\.\d+)?/); return m ? Number(m[0]) : 0; }
  function turnKm(cat) { var k = catKm(cat) / 2; return k ? (Math.round(k * 10) / 10) + ' km' : ''; }   // 5KM → 2.5 km
  function raceClock(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    return Math.floor(s / 3600) + ':' + ('0' + Math.floor(s % 3600 / 60)).slice(-2) + ':' + ('0' + s % 60).slice(-2);
  }
  function clockOn(gun, fin, total) { var now = Date.now(); return !!gun && now >= gun && fin < total && now - gun < 6 * 3600000; }

  function trackTabs() {
    var f = DATA.funrun;
    return ['All'].concat(f.categories).map(function (c) {
      var lbl = c === 'All' ? 'All'
        : '<span class="dot bg-' + catKey(c) + '"></span>' + esc(c) + ' <span class="muted">' +
          f.results.filter(function (x) { return x.cat === c; }).length + '/' + fmt(f.counts[c] || 0) + '</span>';
      return '<button type="button" class="tab' + (c === state.trackCat ? ' on' : '') + '" data-trkcat="' + esc(c) + '">' + lbl + '</button>';
    }).join('');
  }

  function stageTime(x, stage) { return stage === 3 ? (x.fin.t || 0) : (stage === 2 ? x.ps[x.last.name].t : 0); }

  function runnerChip(x, stage, now) {
    var t = stageTime(x, stage), info = '', rank = '';
    if (stage === 3) { info = x.fin.time || x.fin.clock || ''; rank = x.fin.rank ? '#' + x.fin.rank : ''; }
    else if (stage === 2) { var p = x.ps[x.last.name]; info = p.split || p.clock || ''; }
    var fresh = t && now - t < 120000;                                   // reached this stage in the last 2 minutes
    var moved = TRK.moved[x.r.bib] && now - TRK.moved[x.r.bib] < 5000;  // moved since the last refresh
    return '<li class="rc' + (fresh ? ' fresh' : '') + (moved ? ' moved' : '') + '">' +
      (stage === 3 ? '<span class="rc-rank">' + esc(rank) + '</span>' : '') +
      '<span class="rc-bib">' + esc(x.r.bib) + '</span><span class="rc-name">' + esc(x.r.name) + '</span>' +
      (fresh ? '<span class="rc-new">NEW</span>' : '') + (info ? '<span class="rc-time">' + esc(info) + '</span>' : '') + '</li>';
  }

  function laneLimit(stage) {
    if (state.page !== 'live') return window.innerWidth < 640 ? 5 : 8;
    if (stage === 1) return 48;                                                   // big screen: bib numbers only
    var row = window.innerWidth >= 1500 ? 46 : 41, h = window.innerHeight;       // big screen: fit everything on one TV screen
    return Math.max(2, Math.floor(state.trackCat === 'All' ? ((h - 560) / 2 - 85) / row : (h - 470) / row));
  }

  function laneHtml(cat, stage, icon, title, list, cls, none) {
    var key = cat + '|' + stage, lim = laneLimit(stage), now = Date.now();
    var compact = state.page === 'live' && stage === 1;
    var all = TRK.open[key] || !!state.trackQuery || list.length <= lim + (state.page === 'live' ? 0 : 2);
    var shown = all ? list : list.slice(0, lim);
    if (!all && !compact) {      // shortened list: the leaders, plus whoever arrived in the last 2 minutes
      var fresh = list.filter(function (x) { return now - stageTime(x, stage) < 120000; }).slice(-Math.min(3, lim - 1));
      shown = list.slice(0, lim - fresh.length).filter(function (x) { return fresh.indexOf(x) === -1; }).concat(fresh);
    }
    var more = shown.length < list.length ? (compact ? '+' + (list.length - shown.length) + ' more' : 'Show all ' + list.length)
      : (TRK.open[key] && list.length > lim + 2 ? 'Show fewer' : '');
    var items = compact
      ? '<div class="lane-bibs">' + shown.map(function (x) { return '<span title="' + esc(x.r.name) + '">' + esc(x.r.bib) + '</span>'; }).join('') + '</div>'
      : '<ol class="lane-list">' + shown.map(function (x, i) {
          var gap = i > 0 && list.indexOf(x) !== list.indexOf(shown[i - 1]) + 1;   // runners skipped in between
          return (gap ? '<li class="rc-gap" aria-hidden="true">⋯</li>' : '') + runnerChip(x, stage, now);
        }).join('') + '</ol>';
    return '<section class="lane ' + cls + '" aria-label="' + esc(cat + ' – ' + title + ': ' + list.length) + '">' +
      '<h3 class="lane-h"><span>' + icon + ' ' + esc(title) + '</span><b>' + list.length + '</b></h3>' +
      (list.length ? items : '<p class="lane-empty">' + esc(none) + '</p>') +
      (more ? '<button type="button" class="lane-more" data-lane="' + esc(key) + '">' + more + '</button>' : '') + '</section>';
  }

  function boardHtml(cat) {
    var t = trackRows(cat), cps = t.cps, n = [0, 0, 0, 0], lanes = [[], [], [], []], now = Date.now();
    t.rows.forEach(function (x) { n[x.stage]++; lanes[x.stage].push(x); });
    var q = norm(state.trackQuery).trim();
    if (q) {
      lanes = lanes.map(function (l) { return l.filter(function (x) { return norm(x.r.name + ' ' + x.r.bib).indexOf(q) !== -1; }); });
      if (!lanes[0].length && !lanes[1].length && !lanes[2].length && !lanes[3].length) return '';
    }
    var gun = DATA.race.gun && DATA.race.gun[cat], total = t.rows.length, k = catKey(cat), tk = turnKm(cat);
    var begun = t.useStart || n[2] + n[3] > 0 || !!(gun && now >= gun);
    var isTurn = cps.length === 1 && /turn/i.test(cps[0].name), hasCp = cps.length > 0;
    var cpName = isTurn ? 'Turning point' : (cps.length === 1 ? cps[0].name : 'Checkpoint');
    var started = t.useStart ? n[1] + n[2] + n[3] : (begun ? total : 0);

    var head = '<header class="bd-head bg-' + k + '"><div class="bd-title"><b class="bd-cat">' + esc(cat) + '</b>' +
      (hasCp ? '<span class="bd-turn">' + esc(cpName) + (isTurn && tk ? ' at ' + tk : '') + '</span>' : '') + '</div>' +
      (clockOn(gun, n[3], total) ? '<span class="bd-clock" data-gun="' + gun + '" data-cat="' + esc(cat) + '" title="Race clock">⏱ ' + raceClock(now - gun) + '</span>' : '') +
      '<span class="bd-fin"><b>' + n[3] + '</b> / ' + total + ' finished</span></header>';

    var node = function (cls, label, count, what) {
      return '<div class="cs-node ' + cls + '"><span class="cs-dot"></span><span class="cs-lbl">' + label + '</span>' +
        '<b class="cs-n">' + count + '</b><small>' + what + '</small></div>';
    };
    var leg = function (count, what) {
      return '<div class="cs-leg' + (count ? ' on' : '') + '">' + (count ? '<span class="cs-run" title="' + count + ' ' + what + '">🏃 ' + count + '</span>' : '') + '</div>';
    };
    var course = '<div class="course" role="img" aria-label="' + esc(cat + ': ' + started + ' started, ' + (hasCp ? (n[2] + n[3]) + ' reached the ' + cpName.toLowerCase() + ', ' : '') + n[3] + ' finished') + '">' +
      node('cs-start', 'Start', started, 'started') +
      (hasCp ? leg(n[1], 'heading out') + node('cs-turn', isTurn ? 'Turn' + (tk ? ' · ' + tk : '') : esc(cpName), n[2] + n[3], 'reached') + leg(n[2], 'heading back')
        : leg(n[1], 'on course')) +
      node('cs-fin', 'Finish', n[3], 'finished') + '</div>';

    var outTitle = !begun ? 'Waiting for the start' : (hasCp ? 'On course · heading to the ' + (isTurn ? 'turn' : 'checkpoint') : 'On course');
    var body = laneHtml(cat, 1, '🏃', outTitle, lanes[1], 'ln-out', begun ? 'Nobody out on the first stretch.' : 'No runners yet.') +
      (hasCp ? laneHtml(cat, 2, '↩️', (isTurn ? 'Reached the turn' + (tk ? ' (' + tk + ')' : '') : 'Passed ' + cpName) + ' · heading back', lanes[2], 'ln-back', 'Nobody has reached the ' + (isTurn ? 'turning point' : 'checkpoint') + ' yet.') : '') +
      laneHtml(cat, 3, '🏁', 'Finished', lanes[3], 'ln-fin', 'No finishers yet.');

    var dns = '';
    if (t.useStart && lanes[0].length) {
      var dk = cat + '|0', open = TRK.open[dk] || !!q;
      dns = '<div class="bd-dns"><button type="button" class="lane-more" data-lane="' + esc(dk) + '" aria-expanded="' + open + '">⏳ Not started yet: <b>' + lanes[0].length + '</b> · ' + (open ? 'hide' : 'show') + '</button>' +
        (open ? '<div class="dns-list">' + lanes[0].map(function (x) { return '<span><b>' + esc(x.r.bib) + '</b> ' + esc(x.r.name) + '</span>'; }).join('') + '</div>' : '') + '</div>';
    }
    return '<article class="board c-' + k + '">' + head + course +
      '<div class="lanes" style="--lanes:' + (hasCp ? 3 : 2) + '">' + body + '</div>' + dns + '</article>';
  }

  function trackBody() {
    var cats = DATA.funrun.categories;
    if (state.trackCat !== 'All' && cats.indexOf(state.trackCat) === -1) state.trackCat = 'All';
    var list = state.trackCat === 'All' ? cats : [state.trackCat];
    var boards = list.map(boardHtml).filter(Boolean);
    if (!boards.length) return '<div class="hint">No runner matches “' + esc(state.trackQuery) + '”.</div>';
    return '<div class="boards' + (boards.length > 1 ? ' multi' : '') + '">' + boards.join('') + '</div>';
  }

  function raceBadge() { return DATA.race && DATA.race.live ? '<span class="badge live">Live</span>' : ''; }

  function trackerTools() {
    return '<div class="toolbar"><div class="tabs" id="trk-tabs">' + trackTabs() + '</div>' +
      '<input class="search" id="trackq" type="search" autocomplete="off" placeholder="Find a runner by name or bib" aria-label="Find a runner" value="' + esc(state.trackQuery) + '"></div>';
  }

  function trackerSection() {
    var r = DATA.race;
    if (!r || !r.stations || !r.stations.length) return '';
    var head = '<h2>📡 Live race tracker <span id="race-badge">' + raceBadge() + '</span>' +
      '<small id="race-upd">' + (raceActive() ? raceUpdated() : '') + '</small></h2>';
    var bigBtn = '<a href="#" class="btn ghost big-btn" data-page="live">📺 Big-screen board</a>';
    if (!r.passes.length && !(r.starts || []).length && !DATA.funrun.results.length && !raceActive()) {
      return '<section class="sec">' + head + empty('📡', 'Live tracking starts on race day: one board per category shows who has started, who reached the turning point (' +
        esc(DATA.funrun.categories.map(function (c) { return turnKm(c) + ' for ' + c; }).join(', ')) + ') and who finished, updated within seconds of each check-in.') +
        '<div class="hint">' + bigBtn + '</div></section>';
    }
    return '<section class="sec">' + head + '<div id="trk-feed">' + feedHtml() + '</div>' + trackerTools() +
      '<div id="trk-body">' + trackBody() + '</div><div class="hint">' + bigBtn + ' Show the boards on a TV or projector at the venue.</div></section>';
  }

  // Big-screen board (?page=live): only the category boards, for a TV or projector.
  function viewLive() {
    var r = DATA.race;
    if (!r || !r.stations || !r.stations.length) {
      return '<section class="sec">' + empty('📡', 'The live race board appears once the race stations are set up.') + '</section>';
    }
    return '<section class="sec live-board"><div class="lb-head">' +
      (DATA.info.logo ? '<img class="lb-logo" src="' + safeUrl(DATA.info.logo) + '" alt="" referrerpolicy="no-referrer" onerror="this.remove()">' : '') +
      '<div><div class="eyebrow">' + esc(DATA.info.eventName) + '</div>' +
      '<h1>📡 Live race board <span id="race-badge">' + raceBadge() + '</span></h1></div>' +
      '<div class="tabs" id="trk-tabs">' + trackTabs() + '</div>' +
      '<span class="muted" id="race-upd" title="Tap to check for updates now">' + raceUpdated() + '</span>' +
      '<a href="#" class="btn ghost" data-page="funrun">← Fun Run page</a></div>' +
      '<div id="trk-feed">' + feedHtml() + '</div>' +
      '<div id="trk-body">' + trackBody() + '</div></section>';
  }

  // ---------------- RACE KIT & PAYMENT BOARD (?page=kits) ----------------
  // A wide public board for a TV at the kit-claiming area: every runner with a bib, whether the payment is
  // verified and whether the race bib & kit were claimed. Wide screens show one category page at a time and
  // turn the page every 12 seconds; phones show the whole list with a search box.
  var KBD = { cat: 'All', page: 0, per: 0, q: '', timer: null, prev: null, fresh: {}, feed: [], wide: null };
  function kbWide() { return window.innerWidth >= 900; }
  function kbList(cat) { return DATA.funrun.runners.filter(function (r) { return cat === 'All' || r.cat === cat; }); }
  function kbNoteChanges() {                     // runners whose payment was just verified or kit just claimed
    var cur = {}, now = Date.now();
    DATA.funrun.runners.forEach(function (r) { cur[r.bib] = { pay: r.pay === 'verified', kit: !!r.kit, r: r }; });
    if (KBD.prev) Object.keys(cur).forEach(function (b) {
      var a = KBD.prev[b], c = cur[b];
      if (!a) return;
      if (c.kit && !a.kit) { KBD.fresh[b] = now; KBD.feed.unshift({ t: now, html: '🎽 <b>' + esc(b) + '</b> ' + esc(c.r.name) + ' claimed the race kit' }); }
      if (c.pay && !a.pay) { KBD.fresh[b] = now; KBD.feed.unshift({ t: now, html: '💳 <b>' + esc(b) + '</b> ' + esc(c.r.name) + ' – payment verified' }); }
    });
    KBD.feed = KBD.feed.filter(function (x) { return now - x.t < 600000; }).slice(0, 6);
    KBD.prev = cur;
  }
  function kbPages() {
    var cats = KBD.cat === 'All' ? DATA.funrun.categories : [KBD.cat], per = Math.max(KBD.per || 24, 1), pages = [];
    cats.forEach(function (c) {
      var list = kbList(c), n = Math.max(1, Math.ceil(list.length / per));
      for (var i = 0; i < n; i++) pages.push({ cat: c, i: i, n: n, list: list.slice(i * per, (i + 1) * per) });
    });
    return pages;
  }
  function kbTile(r) {
    var pay = r.pay === 'verified' ? '<span class="kb-chip ok">💳 Verified</span>'
      : (r.pay === 'issue' ? '<span class="kb-chip bad">💳 See desk</span>' : '<span class="kb-chip wait">💳 To verify</span>');
    var kit = r.kit ? '<span class="kb-chip ok">🎽 Claimed</span>' : '<span class="kb-chip no">🎽 Not yet</span>';
    var done = r.pay === 'verified' && r.kit;
    var fresh = KBD.fresh[r.bib] && Date.now() - KBD.fresh[r.bib] < 60000;
    return '<div class="kb-tile c-' + catKey(r.cat) + (done ? ' done' : '') + (fresh ? ' fresh' : '') + '">' +
      '<div class="kb-top"><span class="kb-bib">' + esc(r.bib) + '</span><span class="kb-cat">' + esc(r.cat) + '</span>' +
      (done ? '<span class="kb-done">✔ All set</span>' : '') + '</div>' +
      '<div class="kb-name">' + esc(r.name) + '</div><div class="kb-st">' + pay + kit + '</div></div>';
  }
  function kbMeter(label, n, total) {
    return '<div class="kb-m"><span>' + label + '</span><span class="bar"><i style="width:' + (total ? Math.round(n * 100 / total) : 0) + '%"></i></span>' +
      '<b>' + fmt(n) + ' / ' + fmt(total) + '</b></div>';
  }
  function kbSummary() {
    var f = DATA.funrun;
    var cats = KBD.wide ? ['All'].concat(f.categories) : [KBD.cat];   // phones: only the category picked
    return cats.map(function (c) {
      var list = kbList(c);
      var pay = list.filter(function (r) { return r.pay === 'verified'; }).length, kit = list.filter(function (r) { return r.kit; }).length;
      return '<div class="kb-s' + (c === 'All' ? '' : ' c-' + catKey(c)) + '"><div class="t"><span>' + (c === 'All' ? 'All runners' : esc(c)) + '</span>' +
        '<span class="muted">' + plural(list.length, 'runner') + '</span></div>' +
        kbMeter('💳 Verified', pay, list.length) + kbMeter('🎽 Kit claimed', kit, list.length) + '</div>';
    }).join('');
  }
  function kbTabs() {
    return ['All'].concat(DATA.funrun.categories).map(function (c) {
      return '<button type="button" class="tab' + (c === KBD.cat ? ' on' : '') + '" data-kbcat="' + esc(c) + '">' +
        (c === 'All' ? 'All' : '<span class="dot bg-' + catKey(c) + '"></span>' + esc(c)) + '</button>';
    }).join('');
  }
  function kbFeed() {
    var now = Date.now(), items = KBD.feed.filter(function (x) { return now - x.t < 600000; }).slice(0, 4);
    return items.length ? '<div class="kb-feed"><b>Just now:</b> ' + items.map(function (x) { return '<span>' + x.html + '</span>'; }).join('') + '</div>' : '';
  }
  function kbBody() {
    if (!DATA.funrun.runners.length) return empty('🎽', 'Runners appear here once they have a race bib.');
    if (!KBD.wide) {
      var q = norm(KBD.q).trim();
      var list = kbList(KBD.cat).filter(function (r) { return !q || String(r.bib).indexOf(q) === 0 || norm(r.name).indexOf(q) !== -1; });
      return list.length ? '<div class="kb-grid">' + list.map(kbTile).join('') + '</div>'
        : '<div class="hint">No runner matches “' + esc(KBD.q) + '”. Registered just now? Check again in a few minutes.</div>';
    }
    var pages = kbPages();
    if (KBD.page >= pages.length) KBD.page = 0;
    var p = pages[KBD.page];
    return '<div class="kb-page"><h2><span class="dot bg-' + catKey(p.cat) + '"></span>' + esc(p.cat) +
      (p.n > 1 ? ' <span class="muted">· page ' + (p.i + 1) + ' of ' + p.n + '</span>' : '') + '</h2>' +
      (pages.length > 1 ? '<div class="kb-dots" aria-hidden="true">' + pages.map(function (x, i) { return '<i' + (i === KBD.page ? ' class="on"' : '') + '></i>'; }).join('') + '</div>' : '') +
      '</div><div class="kb-grid" id="kb-grid">' + p.list.map(kbTile).join('') + '</div>';
  }
  function kbRedraw() {
    var b = $('#kb-body'); if (b) b.innerHTML = kbBody();
    var fd = $('#kb-feed'); if (fd) fd.innerHTML = kbFeed();
  }
  function kbFit() {                              // as many tiles per page as fit on the screen, no scrolling
    if (state.page !== 'kits' || !KBD.wide) return;
    var g = $('#kb-grid'), first = g && g.firstElementChild;
    if (!first) return;
    var cs = getComputedStyle(g), gap = parseFloat(cs.rowGap) || 8;
    var cols = cs.gridTemplateColumns.split(' ').filter(Boolean).length || 1;
    var top = g.getBoundingClientRect().top + window.scrollY;
    var rows = Math.max(1, Math.floor((window.innerHeight - top - 14 + gap) / (first.offsetHeight + gap)));
    if (cols * rows !== KBD.per) { KBD.per = cols * rows; kbRedraw(); }
  }
  function kbTurn() {
    clearInterval(KBD.timer);
    KBD.timer = setInterval(function () {
      if (state.page !== 'kits' || !KBD.wide || document.visibilityState === 'hidden') return;
      var n = kbPages().length;
      if (n > 1) { KBD.page = (KBD.page + 1) % n; kbRedraw(); }
    }, 12000);
  }
  function viewKits() {
    KBD.wide = kbWide();
    if (!KBD.prev) kbNoteChanges();
    return '<section class="sec kit-board"><div class="lb-head">' +
      (DATA.info.logo ? '<img class="lb-logo" src="' + safeUrl(DATA.info.logo) + '" alt="" referrerpolicy="no-referrer" onerror="this.remove()">' : '') +
      '<div><div class="eyebrow">' + esc(DATA.info.eventName) + '</div><h1>🎽 Race kit &amp; payment board</h1></div>' +
      '<div class="tabs" id="kb-tabs">' + kbTabs() + '</div>' +
      '<span class="muted" id="kb-upd" title="Tap to check for updates now">' + 'Updated ' + rel(DATA.checkedMs || DATA.generatedMs) + '</span>' +
      '<a href="#" class="btn ghost" data-page="funrun">← Fun Run page</a></div>' +
      (KBD.wide ? '' : '<input class="search" id="kbq" type="search" autocomplete="off" placeholder="Find your bib number or name" value="' + esc(KBD.q) + '" style="margin-bottom:10px">') +
      '<div class="kb-sum" id="kb-sum">' + kbSummary() + '</div>' +
      '<div class="kb-legend"><span class="kb-chip ok">💳 Verified</span> payment checked <span class="kb-chip wait">💳 To verify</span> not checked yet' +
      ' <span class="kb-chip ok">🎽 Claimed</span> race bib &amp; kit received <span class="kb-chip no">🎽 Not yet</span> not claimed yet</div>' +
      '<div id="kb-feed">' + kbFeed() + '</div>' +
      '<div id="kb-body">' + kbBody() + '</div></section>';
  }

  // Remembers each runner's stage, so runners who just moved can be highlighted after a refresh.
  function trkNoteMoves() {
    if (!DATA.race || !DATA.funrun) return;
    var cur = {}, now = Date.now();
    DATA.funrun.categories.forEach(function (c) { trackRows(c).rows.forEach(function (x) { cur[x.r.bib] = x.stage; }); });
    if (TRK.prev) Object.keys(cur).forEach(function (b) { if (TRK.prev[b] !== undefined && cur[b] > TRK.prev[b]) TRK.moved[b] = now; });
    TRK.prev = cur;
  }

  // ---- live race updates ----
  // Every few seconds the page asks the server "anything newer than the version I have?". That
  // question is tiny and fast; the race data itself is downloaded only when a marshal recorded something.
  // Every page asks "anything newer?" every few seconds (a tiny question). Race check-ins download
  // only the small race update; posts in the Site tabs (scores, announcements, programs) reload the page data.
  var RP = { ver: DATA.raceVer || '', site: DATA.siteVer || '', busy: false, timer: null, n: 0 };
  function livePollWanted() {
    return hasGas() && !DATA.light && document.visibilityState !== 'hidden' && state.page !== 'marshal' && state.page !== 'qrcodes';
  }
  function wantRace() {
    return state.page === 'live' || ((state.page === 'funrun' || state.page === 'home') && !!(DATA.race && DATA.race.stations && DATA.race.stations.length));
  }
  function racePollEvery() {                    // how often the page asks "anything new?" (a tiny question)
    if (state.page === 'live') return 1000;      // big-screen race board: every second
    if (state.page === 'kits') return 2000;      // kit & payment board

    if (state.page === 'funrun') return 3000;    // Fun Run page: new registrations

  }

  function refreshRace(now) {
    clearTimeout(RP.timer);
    if (!livePollWanted()) { RP.timer = setTimeout(refreshRace, 3000); return; }
    if (RP.busy) return;
    RP.busy = true; RP.n++;
    var race = wantRace(), full = now === true || RP.n % Math.max(1, Math.round(60000 / racePollEvery())) === 0;   // about once a minute: full race download anyway
    google.script.run.withSuccessHandler(function (txt) {
      RP.busy = false;
      var d = null;
      try { d = JSON.parse(txt); } catch (err) {}
      if (d && d.race && d.race.race) {
        if (!TRK.prev) trkNoteMoves();
        RP.ver = d.race.ver || d.rv || '';
        DATA.race = d.race.race;
        DATA.funrun.results = d.race.results;
        trkNoteMoves();
        updateRaceViews();
      }
      if (d && d.rv) {
        DATA.checkedMs = Date.now();                   // the page is up to date
        if (DATA.race) DATA.race.checkedMs = DATA.checkedMs;
      }
      if (d && d.sv && RP.site && d.sv !== RP.site) refreshData();   // a committee posted something
      if (d && d.sv && !RP.site) RP.site = d.sv;
      RP.timer = setTimeout(refreshRace, racePollEvery());
    }).withFailureHandler(function () { RP.busy = false; RP.timer = setTimeout(refreshRace, 6000); })
      .getLive({ race: full ? '' : RP.ver, site: RP.site, wantRace: race });
  }

  function updateRaceViews() {

  // ---------------- MARSHAL PAGE (?page=marshal) ----------------
  var M = { station: null, pin: '', staff: '', queue: [], recent: [], sending: false, offline: false, error: '', pick: '', note: '', scanBib: '' };
  var DONE_CODES = ['OK', 'FINISHED', 'FINISHED_NO_TURN', 'DUPLICATE', 'DUPLICATE_FINISH', 'WRONG_CATEGORY', 'NOT_REGISTERED', 'STARTED', 'DUPLICATE_START'];
  function mLoad() {

  function mUid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  function viewMarshal() {

    return '<section class="m-wrap">' + stationBar() +
      '<div class="m-clock" id="m-clock">' + esc(mClock(Date.now())) + '</div>' +
      '<form id="m-form" class="m-form" autocomplete="off"><label for="m-bib">Runner’s bib number</label>' +

  function mResult() {

      DUPLICATE_START: ['warn', '⚠️ Bib ' + e.bib + ' already checked in at the start', 'The first check-in is kept.'],
      INVALID_QR: ['bad', '❌ Fake or old QR code on bib ' + e.bib + ' – NOT counted', 'Check the runner. If the bib number is right, type it by hand and tell the race director.'],
      UNDONE: ['wait', '↩️ Bib ' + e.bib + ' – check-in undone', ''],

    return '<div class="m-result ' + v[0] + '"><div class="big">' + esc(v[1]) + '</div>' + who + (note ? '<div class="note">' + esc(note) + '</div>' : '') + '</div>';
  }

  function mPending() {
    var n = M.queue.length;

      (M.lastTook ? ' (took ' + M.lastTook.toFixed(1) + ' s)' : '') + '</div>' : '';
    var secs = Math.max(0, Math.ceil(((M.retryAt || 0) - Date.now()) / 1000));

    if (M.sending) return '<div class="m-pending">⏳ Sending ' + n + ' check-in(s)…</div>';

      return '<div class="m-pending">📶 <b>No internet on this phone.</b> ' + n + ' check-in(s) are saved here and send by themselves ' +

        '. Retrying' + (secs ? ' in ' + secs + ' s' : '…') + btn + '</div>';

  function mRecent() {
    if (!M.recent.length) return '<div class="m-row"><span></span><span class="muted">Nothing yet.</span><span></span></div>';
    var short = { PENDING: '⏳', OK: '✅', FINISHED: '🏁', FINISHED_NO_TURN: '⚠️', DUPLICATE: '⚠️ dup', DUPLICATE_FINISH: '⚠️ dup', WRONG_CATEGORY: '⚠️ cat', STARTED: '🟢', DUPLICATE_START: '⚠️ dup', INVALID_QR: '❌ QR', NOT_REGISTERED: '❌', UNDONE: '↩️', ERROR: '❌' };
    return M.recent.slice(0, 20).map(function (e) {
      var canUndo = DONE_CODES.indexOf(e.code) !== -1;
      return '<div class="m-row' + (e.code === 'UNDONE' ? ' undone' : '') + '"><time>' + esc(mClock(e.clientTime)) + '</time>' +
        '<span class="who">' + esc(short[e.code] || '') + ' <b>' + esc(e.bib) + '</b> ' + esc(e.name || '') + '</span>' +
        (canUndo ? '<button class="m-undo" data-undo="' + esc(e.id) + '">Undo</button>' : '<span></span>') + '</div>';
    }).join('');

  function mRefresh() {
    if (state.page !== 'marshal' || !$('#m-result')) return;
    $('#m-result').innerHTML = mResult();
    $('#m-pending').innerHTML = mPending();
    $('#m-recent').innerHTML = mRecent();
    $('#m-note').textContent = M.note;
    if ($('#m-clear') && !M.clearAsk) $('#m-clear').innerHTML = mClearHtml();
  }

  function mSetRecent(id, res) {
    M.recent.forEach(function (e) {
      if (e.id !== id) return;
      e.code = res.code; e.label = res.label || res.error || '';
      if (res.name) e.name = res.name;
      if (res.cat) e.cat = res.cat;
      if (res.clock) e.clock = res.clock;
      if (res.rank) e.rank = res.rank;
      if (res.warnings) e.warnings = res.warnings;
      if (res.qr) e.qr = res.qr;
      if (res.gender) e.gender = res.gender;
      if (res.bracket) e.bracket = res.bracket;
      if (res.org) e.org = res.org;
      if (res.genderRank) e.genderRank = res.genderRank;
    });
  }

  function mSubmit() {
    var input = $('#m-bib');
    var raw = String(input.value || '');
    var link = parseQrLink(raw);                 // a scanner may type the whole QR link
    input.value = '';
    input.focus();
    if (link) mRecord(link.bib, link.code);
    else mRecord(raw.replace(/\D/g, ''), '');
  }

  function mRecord(bib, qrCode) {
    bib = bib ? String(Number(bib)) : '';
    if (!bib || bib === '0' || bib === 'NaN') return;
    var e = { id: mUid(), bib: bib, clientTime: Date.now(), code: 'PENDING', qrc: qrCode || '' };
    M.queue.push({ id: e.id, bib: bib, clientTime: e.clientTime, qrc: e.qrc });
    M.recent.unshift(e);
    M.note = '';
    mSave(); mRefresh(); mPump();
  }

  // Sends EVERY waiting check-in in one call. Retries by itself: within ~1 s when the phone gets
  // signal back, every 3 s while offline, and quickly (1.5 s, 3 s, 4.5 s … max 10 s) on a server hiccup.
  function mPump() {
    if (M.sending || !M.queue.length || !hasGas() || !M.station || !M.pin) return;
    clearTimeout(M.retryTimer);
    M.sending = true;
    var batch = M.queue.slice(0, 25);
    var started = Date.now();
    mRefreshPending();
    google.script.run.withSuccessHandler(function (res) {
      M.sending = false;
      M.lastTook = (Date.now() - started) / 1000;
      if (res && res.authError) {               // PIN changed or station removed: sign in again, keep the queue
        M.pin = ''; M.error = res.error; mSave(); render(); return;
      }
      if (!res || !res.ok || !res.results) { mFail({ message: (res && res.error) || 'The website did not answer properly' }, true); return; }
      M.offline = false; M.lastError = ''; M.fails = 0; M.lastSent = Date.now();
      var sent = {};
      batch.forEach(function (q, k) {
        var r = res.results[k];
        sent[q.id] = 1;
        mSetRecent(q.id, r && r.ok ? r : { code: 'ERROR', error: (r && r.error) || 'Not saved. Try again.' });
      });
      M.queue = M.queue.filter(function (q) { return !sent[q.id]; });
      camResult(M.recent.filter(function (x) { return x.id === batch[batch.length - 1].id; })[0]);
      mSave(); mRefresh(); mPump();
    }).withFailureHandler(function (err) {
      M.sending = false;
      mFail(err, false);
    }).recordCheckpoints({
      station: M.station.name, pin: M.pin,
      entries: batch.map(function (q) { return { bib: q.bib, clientTime: q.clientTime, id: q.id, qrCode: q.qrc || '' }; })
    });
  }

  // Plain-language reason + fix for the errors marshals can actually meet
  function friendlyError(msg) {
    msg = String(msg || '').replace(/^(Exception|Error|ScriptError):\s*/i, '').replace(/[.\s]+$/, '');
    if (/lock timeout|busy|too long/i.test(msg)) return 'the spreadsheet was busy for a moment';
    if (/HTTP 40[13]|authoriz|permission|access denied|not allowed|log ?in|sign ?in/i.test(msg)) return 'this phone is not allowed to use the website – open the marshal link that ends in /exec?page=marshal, and the organizer must set Deploy → Who has access: Anyone';
    if (/HTTP 5\d\d|server error|internal error/i.test(msg)) return 'Google’s server had a short hiccup (this is not your internet)';
    if (/timed? ?out|exceeded maximum execution/i.test(msg)) return 'the spreadsheet took too long to answer';
    if (/function not found|is not defined|unknown request/i.test(msg)) return 'the website link is running an older version of the script – the organizer must use Apps Script → Deploy → Manage deployments → ✏️ Edit → Version: New version → Deploy';
    if (/too many times|quota|rate/i.test(msg)) return 'Google’s usage limit was reached – wait a minute';
    return (msg || 'unknown error').slice(0, 140);
  }

  function mFail(err, serverAnswered) {
    var msg = String((err && err.message) || err || '');
    // Only "no internet" when the phone really is offline. Google reports server hiccups as
    // "NetworkError: Connection failure due to HTTP 500" – that is NOT the phone's internet.
    // A network error WITH a server code (HTTP 500, 401 …) is a website problem; WITHOUT one (or HTTP 0) it is the signal.
    M.offline = !serverAnswered && (navigator.onLine === false ||
      (/network|connection|failed to fetch|load failed|internet|ERR_INTERNET/i.test(msg) && !/HTTP [1-9]\d\d/.test(msg)));
    M.lastError = M.offline ? '' : friendlyError(msg);
    M.fails = (M.fails || 0) + 1;
    var wait = M.offline ? 3000 : Math.min(8000, 1000 * M.fails);
    M.retryAt = Date.now() + wait;
    mSave(); mRefresh();
    clearTimeout(M.retryTimer);
    M.retryTimer = setTimeout(mPump, wait);
  }

  function mRefreshPending() { var el = $('#m-pending'); if (el) el.innerHTML = mPending(); }

  // ---- 🧹 clear this phone's list (e.g. after a practice run) ----
  function mClearHtml() {
    if (!M.clearAsk) {

    }

    return '<div class="m-clear-box"><b>Clear the list on this phone?</b>' +
      '<div class="note">This only empties the list on this phone. Check-ins already sent stay in the spreadsheet. ' +
      'To remove practice check-ins from the spreadsheet, the organizer uses 🏃 Fun Run → 🧹 Clear test check-ins.</div>' +
      (unsent ? '<div class="v-line warn">⚠️ ' + unsent + ' check-in(s) are NOT sent yet. If you delete them they will never be recorded.</div>' : '') +
      '<div class="p-actions"><button type="button" class="btn sm" data-mclear="sent">' + (unsent ? 'Clear sent ones only' : 'Yes, clear the list') + '</button>' +
      (unsent ? '<button type="button" class="btn ghost sm" data-mclear="all">Also delete the ' + unsent + ' unsent</button>' : '') +
      '<button type="button" class="btn ghost sm" data-mclear="cancel">Cancel</button></div></div>';
  }

  function mClear(mode) {
    if (mode === 'ask') { M.clearAsk = true; }
    else if (mode === 'cancel') { M.clearAsk = false; }
    else {
      var keep = {};
      if (mode !== 'all') M.queue.forEach(function (q) { keep[q.id] = 1; });
      else { M.queue = []; clearTimeout(M.retryTimer); M.lastError = ''; M.offline = false; }
      M.recent = M.recent.filter(function (e) { return keep[e.id]; });
      M.lastSent = 0; M.lastTook = 0; M.note = ''; M.clearAsk = false;
      mSave();

    mRefresh();

  function mLogin() {
    var pin = String(($('#m-pin') || {}).value || '').trim();
    M.staff = String(($('#m-staff') || {}).value || '').trim().slice(0, 40);
    if (!M.pick) { M.error = 'Pick your station first.'; render(); return; }
    if (!pin) { M.error = 'Enter your station PIN.'; render(); return; }
    if (!hasGas()) return;
    google.script.run.withSuccessHandler(function (res) {
      if (res && res.ok) { M.station = res.station; M.pin = pin; M.error = ''; mSave(); render(); mPump(); }
      else { M.error = (res && res.error) || 'Could not sign in.'; render(); }
    }).withFailureHandler(function () { M.error = 'No internet connection. Try again when you have signal.'; render(); })
      .marshalLogin(M.pick, pin);
  }

  function mUndo(id) {

      .undoCheckpoint({ station: M.station.name, pin: M.pin, id: id });

  var wakeLock = null;

  // ---------------- STAFF STATIONS: shared ----------------
  function stType(st) {
    if (!st) return '';
    if (st.type) return st.type;
    var n = String(st.name || '').toLowerCase();
    if (/finish/.test(n)) return 'finish';
    if (/payment|cashier|treasur/.test(n)) return 'payment';

  function stSub(s) {
    var t = stType(s);
    if (t === 'finish') return 'Finish line · record finishers';

    if (t === 'payment') return 'Payment desk · verify payment proofs';
    if (t === 'kit') return 'Kit claiming · release bibs & singlets';

  function stationBar() {

      '</b><span>' + esc(stSub(M.station)) + '</span></div><button class="btn" data-m="logout">Change</button></div>';

  function staffReq(extra) {

    Object.keys(extra || {}).forEach(function (k) { r[k] = extra[k]; });

  function staffAuthFail(res) {

    return false;

  function bibFromText(raw) {

  }
  function payBadge(pay, by, at, note) {
    if (pay === 'Verified') return '<div class="v-line ok">✅ Payment verified' + (by ? '<small>' + esc(by) + (at ? ' · ' + esc(at) : '') + '</small>' : '') + '</div>';
    if (pay === 'Rejected') return '<div class="v-line bad">❌ Payment rejected' + (note ? ': ' + esc(note) : '') + (by ? '<small>' + esc(by) + (at ? ' · ' + esc(at) : '') + '</small>' : '') + '</div>';
    return '<div class="v-line warn">⏳ Payment not verified yet</div>';
  }

  // ---------------- KIT CLAIMING ----------------
  var K = { q: '', res: null, card: null, busy: false, msg: '', ok: '', stats: null, confirmUnpaid: false };
  function kitReset() { K.q = ''; K.res = null; K.card = null; K.busy = false; K.msg = ''; K.ok = ''; K.confirmUnpaid = false; }

  function viewKit() {
    return '<section class="m-wrap">' + stationBar() +
      '<form id="k-form" class="m-form" autocomplete="off"><label for="k-q">Bib number or runner’s name</label>' +
      '<input id="k-q" class="m-bib k-q" type="search" autocomplete="off" placeholder="Bib or name" value="' + esc(K.q) + '">' +
      '<button class="m-go" type="submit">Find runner</button></form>' +
      '<div id="cam-wrap" class="cam-wrap">' + camHtml() + '</div>' +
      '<div id="k-out" aria-live="polite">' + kitOut() + '</div>' +
      '<div id="k-stats" class="m-clock">' + kitStatsText() + '</div>' +
      '<a href="#" class="btn ghost" data-page="qrcodes" style="justify-self:center">🖨 Print race bibs &amp; QR codes</a></section>';
  }
  function kitStatsText() { return K.stats ? '🎽 Kits released: ' + fmt(K.stats.claimed) + ' of ' + fmt(K.stats.total) + ' runners' : ''; }

  function kitOut() {
    if (K.busy) return '<div class="m-result wait"><div class="note">Searching…</div></div>';
    if (K.msg) return '<div class="m-result bad"><div class="note">' + esc(K.msg) + '</div></div>';
    if (K.card) return kitCard(K.card);
    if (K.res && !K.res.length) return '<div class="m-result warn"><div class="big">No runner found</div><div class="note">Check the bib number, or type part of the name.</div></div>';
    if (K.res) {
      return '<div class="m-recent">' + K.res.map(function (r) {
        return '<button type="button" class="m-row k-pick" data-kpick="' + esc(r.regId) + '"><span class="bibtxt">' + esc(r.bib || '—') + '</span>' +
          '<span class="who"><b>' + esc(r.name) + '</b> · ' + esc(r.cat || 'no category') + '</span>' +
          (r.kit ? '<span class="pill s2">Claimed</span>' : '<span class="pill s0">Not claimed</span>') + '</button>';
      }).join('') + '</div>';
    }
    return '<div class="m-result wait"><div class="note">Search a runner, or scan the QR code on their claim stub with your phone camera.</div></div>';
  }

  function kitCard(r) {
    var band = r.cat ? '<div class="bib-band bg-' + catKey(r.cat) + '">' + esc(r.cat) + '</div>' : '<div class="bib-band" style="background:#6b7a72">NO CATEGORY</div>';
    var head = '<div class="bibcard">' + band + '<div class="bib-no">' + esc(r.bib || '—') + '</div><div class="bib-name">' + esc(r.name) +
      '</div><div class="bib-club">' + esc(r.gender || '') + '</div></div>';
    var size = '<div class="v-size"><small>Singlet size</small><b>' + esc(r.size || 'Not specified') + '</b></div>';
    var kit = r.kit ? '<div class="v-line ok">🎽 Kit already released' + (r.kitAt ? ' · ' + esc(r.kitAt) : '') +
      '<small>' + (r.kitBy && r.kitBy !== 'Runner' ? 'Claimed by ' + esc(r.kitBy) + ' · ' : '') + esc(r.kitStaff || '') + '</small></div>' : '';
    var act;
    if (!r.bib) act = '<div class="v-line bad">No bib yet (no race category). Send the runner to the registration desk.</div>';
    else if (r.kit) act = '<button type="button" class="btn ghost" data-kundo="' + esc(r.regId) + '">Undo release (mistake)</button>';
    else {
      act = '<label for="k-by" class="v-lbl">Claimed by someone else? Their name (optional)</label>' +
        '<input id="k-by" class="search plain" type="text" maxlength="60" autocomplete="off" placeholder="Leave blank if the runner is here">';
      act += (r.pay !== 'Verified' && K.confirmUnpaid)
        ? '<div class="v-line warn">Payment is not verified. Release only if the runner paid now or an organizer approved it.</div>' +
          '<button type="button" class="m-go m-warn" data-krelease="force">Release anyway</button>'
        : '<button type="button" class="m-go" data-krelease="1">Release bib &amp; singlet</button>';
    }
    return '<div class="k-card">' + (K.ok ? '<div class="m-result good"><div class="big">' + esc(K.ok) + '</div></div>' : '') +
      (K.card && K.card.bib === r.bib ? qrBadge(K.qr, r.bib) : '') + head + size + payBadge(r.pay, r.payBy, r.payAt, r.payNote) + kit + act + '</div>';
  }

  function kitRefresh() {
    if (!$('#k-out')) return;
    $('#k-out').innerHTML = kitOut();
    $('#k-stats').textContent = kitStatsText();
  }

  function kitSearch(q) {
    var raw = String(q || '').trim();
    q = bibFromText(raw) || raw;
    K.q = q; K.res = null; K.card = null; K.msg = ''; K.ok = ''; K.confirmUnpaid = false; K.qr = '';
    if ($('#k-q') && q !== raw) $('#k-q').value = q;   // a scanner typed the whole QR link: show just the bib
    if (!q) { kitRefresh(); return; }
    if (!hasGas()) return;
    K.busy = true; kitRefresh();
    google.script.run.withSuccessHandler(function (res) {
      K.busy = false;
      if (staffAuthFail(res)) return;
      if (!res || !res.ok) { K.msg = (res && res.error) || 'Search failed. Try again.'; kitRefresh(); return; }
      K.res = res.matches; K.stats = res.stats;
      K.qr = res.qr || K.pendingCheck || ''; K.pendingCheck = '';
      if (res.matches.length === 1) K.card = res.matches[0];
      kitRefresh();
    }).withFailureHandler(function () { K.busy = false; K.msg = 'No signal. Try again in a moment.'; kitRefresh(); })
      .staffLookup(staffReq({ query: raw }));
  }

  function kitRelease(force) {
    var r = K.card;
    if (!r || !hasGas()) return;
    var by = String(($('#k-by') || {}).value || '').trim();
    K.busy = true; kitRefresh();
    google.script.run.withSuccessHandler(function (res) {
      K.busy = false;
      if (staffAuthFail(res)) return;
      if (res && res.ok) {
        K.card = res.runner; K.stats = res.stats; K.confirmUnpaid = false;
        K.ok = '✅ Released bib ' + res.runner.bib + ' + singlet ' + (res.runner.size || '') + ' to ' + (by || res.runner.name);
        kitRefresh();
        camResume();
        var q = $('#k-q'); if (q) { q.value = ''; K.q = ''; }
        return;
      }
      if (res && res.code === 'UNPAID') { K.card = res.runner; K.confirmUnpaid = true; K.ok = ''; }
      else if (res && res.code === 'ALREADY') { K.card = res.runner; K.ok = ''; K.msg = ''; }
      else K.msg = (res && res.error) || 'Not saved. Try again.';
      kitRefresh();
    }).withFailureHandler(function () { K.busy = false; K.msg = 'No signal – the kit was NOT recorded. Try again.'; kitRefresh(); })
      .releaseKit(staffReq({ regId: r.regId, claimedBy: by, force: force === 'force' }));
  }

  function kitUndo(regId) {
    if (!hasGas()) return;
    google.script.run.withSuccessHandler(function (res) {
      if (staffAuthFail(res)) return;
      if (res && res.ok) { K.card = res.runner; K.stats = res.stats; K.ok = ''; K.msg = ''; }
      else K.msg = (res && res.error) || 'Could not undo.';
      kitRefresh();
    }).withFailureHandler(function () { K.msg = 'No signal – try Undo again.'; kitRefresh(); })
      .undoKit(staffReq({ regId: regId }));
  }

  // ---------------- PAYMENT DESK ----------------
  var P = { items: null, tab: 'Pending', q: '', busy: false, msg: '' };
  function payReset() { P.items = null; P.tab = 'Pending'; P.q = ''; P.busy = false; P.msg = ''; }

  function viewPayment() {
    if (!P.items && !P.busy && hasGas()) setTimeout(payLoad, 0);
    return '<section class="m-wrap wide">' + stationBar() +
      '<div class="toolbar"><div class="tabs" id="p-tabs">' + payTabs() + '</div>' +
      '<input class="search" id="p-q" type="search" autocomplete="off" placeholder="Search name, bib or reference no." value="' + esc(P.q) + '">' +
      '<button type="button" class="btn ghost" data-prefresh="1">↻ Refresh</button></div>' +
      '<div id="cam-wrap" class="cam-wrap">' + camHtml() + '</div>' +
      '<p class="muted" style="margin:0;font-size:13px">Proof links open in Google Drive. You need access to the Drive of the account that owns the forms.</p>' +
      '<div id="p-list">' + payList() + '</div>' +
      '<a href="#" class="btn ghost" data-page="qrcodes" style="justify-self:center">🖨 Print race bibs &amp; QR codes</a></section>';
  }

  function payLoad() {
    if (!hasGas()) return;
    P.busy = true; payRefresh();
    google.script.run.withSuccessHandler(function (res) {
      P.busy = false;
      if (staffAuthFail(res)) return;
      if (!res || !res.ok) P.msg = (res && res.error) || 'Could not load the list.';
      else { P.items = res.items; P.msg = ''; }
      payRefresh();
    }).withFailureHandler(function () { P.busy = false; P.msg = 'No signal. Tap Refresh to try again.'; payRefresh(); })
      .getPaymentQueue(staffReq({}));
  }

  function payTabs() {
    var c = { Pending: 0, Verified: 0, Rejected: 0, All: 0 };
    (P.items || []).forEach(function (x) { c[x.pay]++; c.All++; });
    var label = { Pending: '⏳ To check', Verified: '✅ Verified', Rejected: '❌ Rejected', All: 'All' };
    return ['Pending', 'Verified', 'Rejected', 'All'].map(function (k) {
      return '<button type="button" class="tab' + (P.tab === k ? ' on' : '') + '" data-ptab="' + k + '">' + label[k] + ' <span class="muted">' + c[k] + '</span></button>';
    }).join('');
  }

  function payList() {
    if (P.msg) return '<div class="m-result bad"><div class="note">' + esc(P.msg) + '</div></div>';
    if (!P.items) return '<div class="m-result wait"><div class="note">Loading registrations…</div></div>';
    var q = norm(P.q).trim();
    var list = P.items.filter(function (x) {
      return (P.tab === 'All' || x.pay === P.tab) && (!q || norm([x.name, x.bib, x.payment, x.source].join(' ')).indexOf(q) !== -1);
    });
    if (!list.length) return empty('🧾', P.tab === 'Pending' && !q ? 'Nothing left to check. 🎉' : 'No registrations match.');
    return '<div class="p-list">' + list.map(payCard).join('') + '</div>';
  }

  function payCard(x) {
    var proof = x.proof.length ? x.proof.map(function (u, i) {
      return '<a class="btn ghost sm" href="' + safeUrl(u) + '" target="_blank" rel="noopener">View proof' + (x.proof.length > 1 ? ' ' + (i + 1) : '') + ' ↗</a>';
    }).join('') : '<span class="muted">No proof uploaded</span>';

      var lbl = { Verified: '✅ Verify payment', Rejected: '❌ Reject', Pending: '↩ Back to "to check"' }[s];
      return '<button type="button" class="btn' + (s === 'Verified' ? '' : ' ghost') + ' sm" data-pay="' + s + '" data-reg="' + esc(x.regId) + '">' + lbl + '</button>';
    }).join('');
    return '<article class="card p-card" data-card="' + esc(x.regId) + '">' +
      '<div class="p-top"><div><b>' + esc(x.name || '(no name)') + '</b><div class="muted" style="font-size:13px">' +
      (x.bib ? 'Bib ' + esc(x.bib) + ' · ' : '') + esc(x.cat || 'No category') + ' · ' + esc(x.source) + ' · ' + esc(x.registered) + '</div></div>' +
      '<div class="p-fee">' + esc(x.fee || '') + '<small>' + esc(x.regType || '') + '</small></div></div>' +
      '<dl class="p-dl">' + (x.payment ? '<dt>Payment / reference</dt><dd>' + esc(x.payment) + '</dd>' : '') +
      (x.receivedBy ? '<dt>Received by</dt><dd>' + esc(x.receivedBy) + '</dd>' : '') +

  function payRefresh() {

    $('#p-tabs').innerHTML = payTabs();
    $('#p-list').innerHTML = payList();
  }

  function paySet(btn) {
    var regId = btn.getAttribute('data-reg'), status = btn.getAttribute('data-pay');
    var card = btn.closest('.p-card');
    var note = card ? String((card.querySelector('.p-note') || {}).value || '').trim() : '';
    if (!hasGas()) return;
    btn.disabled = true; btn.textContent = 'Saving…';
    google.script.run.withSuccessHandler(function (res) {
      if (staffAuthFail(res)) return;

        P.items = P.items.map(function (x) { return x.regId === regId ? res.item : x; });
        camResume();
      } else {
        P.msg = (res && res.error) || 'Not saved.';
      }
      payRefresh();
    }).withFailureHandler(function () { btn.disabled = false; btn.textContent = 'No signal – tap again'; })
      .setPayment(staffReq({ regId: regId, status: status, note: note }));
